<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8" />
    <title>Jakarta Faces - Gestión de Productos (JettraEE)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 30px 20px;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h2 {
            margin: 0;
            color: #0369a1;
        }
        .nav-link {
            text-decoration: none;
            color: #0284c7;
            font-weight: 600;
        }
        .alert-msg {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 500;
        }
        .form-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: flex-end;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-submit {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table.data-table th, table.data-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        table.data-table th {
            background: #f8fafc;
            color: #334155;
            font-weight: 700;
            font-size: 14px;
        }
        table.data-table tr:hover {
            background: #f1f5f9;
        }
        .badge-cat {
            background: #e2e8f0;
            color: #334155;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .price {
            font-weight: 700;
            color: #0f766e;
        }
    </style>
</h:head>
<h:body>
    <div class="container">
        <div class="header-bar">
            <h2>🎭 Catálogo de Productos (Jakarta Faces)</h2>
            <a href="/index.xhtml" class="nav-link">← Volver al Portal</a>
        </div>

        <div class="alert-msg">
            <h:outputText value="#{productoBean.mensaje}" />
        </div>

        <!-- Formulario Jakarta Faces <h:form> -->
        <div class="form-box">
            <h3 style="margin-top:0; color:#1e293b;">Registrar Nuevo Producto</h3>
            <h:form>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre del Producto:</label>
                        <h:inputText value="#{productoBean.nombre}" styleClass="form-input" placeholder="Ej. Smartphone 5G" />
                    </div>
                    <div class="form-group">
                        <label>Categoría:</label>
                        <h:inputText value="#{productoBean.categoria}" styleClass="form-input" placeholder="Ej. Electrónica" />
                    </div>
                    <div class="form-group">
                        <label>Precio (#{productoBean.moneda}):</label>
                        <h:inputText value="#{productoBean.precio}" styleClass="form-input" placeholder="0.00" />
                    </div>
                    <div class="form-group">
                        <label>Stock Disponible:</label>
                        <h:inputText value="#{productoBean.stock}" styleClass="form-input" placeholder="0" />
                    </div>
                    <div>
                        <h:commandButton value="Guardar Producto" action="#{productoBean.guardar}" styleClass="btn-submit" />
                    </div>
                </div>
            </h:form>
        </div>

        <!-- Tabla Jakarta Faces <h:dataTable> -->
        <h3 style="color:#1e293b;">Listado de Productos en Inventario (<h:outputText value="#{productoBean.totalProductos}" /> ítems)</h3>
        <h:dataTable value="#{productoBean.productos}" var="p" styleClass="data-table">
            <h:column>
                <f:facet name="header">Código</f:facet>
                #{p.id}
            </h:column>
            <h:column>
                <f:facet name="header">Descripción / Nombre</f:facet>
                <strong>#{p.nombre}</strong>
            </h:column>
            <h:column>
                <f:facet name="header">Categoría</f:facet>
                <span class="badge-cat">#{p.categoria}</span>
            </h:column>
            <h:column>
                <f:facet name="header">Precio</f:facet>
                <span class="price">$#{p.precio}</span>
            </h:column>
            <h:column>
                <f:facet name="header">Stock</f:facet>
                #{p.stock} unidades
            </h:column>
        </h:dataTable>
    </div>
</h:body>
</html>
